# Argo CD Application for the GitLab CE stage.
# deploy.sh substitutes GIT_REPO_URL and GIT_REPO_BRANCH from .env before
# applying this manifest, so the committed values are placeholders.
# The gitlab-initial-root-password Secret must be provisioned (deploy.sh step)
# before this Application is applied, so the GitLab CR can reference it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: mta-agents-demo
  annotations:
    argocd.argoproj.io/manifest-generate-paths: /gitops/stages/gitlab
spec:
  project: mta-agents-demo
  source:
    repoURL: "${GIT_REPO_URL}"
    targetRevision: "${GIT_REPO_BRANCH}"
    path: gitops/stages/gitlab
  destination:
    server: https://kubernetes.default.svc
    namespace: gitlab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    # OLM stamps startingCSV after first install
    - group: operators.coreos.com
      kind: Subscription
      jsonPointers:
        - /spec/startingCSV
    # Namespace labels/annotations managed by OpenShift
    - group: ""
      kind: Namespace
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
    # OperatorGroup annotations stamped by OLM
    - group: operators.coreos.com
      kind: OperatorGroup
      jsonPointers:
        - /metadata/annotations
